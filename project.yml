name: Constellation
options:
  bundleIdPrefix: dev.ashleyhunter
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  ConstellationKit:
    path: Packages/ConstellationKit
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 2.2.2026103001
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  Constellation:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Fonts
          - Resources/Icon/generate.py
          - Resources/Backgrounds
      - path: App/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: App/Resources/Backgrounds
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        ATSApplicationFontsPath: Fonts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Updates: the newest release's appcast.xml. See .github/workflows/release.yml.
        SUFeedURL: https://github.com/ashley-hunter/constellation/releases/latest/download/appcast.xml
        SUPublicEDKey: pYPUFMo8TiZqvVMRnqqxFWIC4ZEgH/w9VPvcA+eyozA=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ashleyhunter.constellation
        PRODUCT_NAME: Constellation
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Constellation
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # A stable identity, so privacy grants survive rebuilds (ad-hoc signatures change every build).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: 3A4A3D69L8
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        # Releases go out signed with Developer ID, which is what notarization accepts.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
    dependencies:
      - package: ConstellationKit
        product: ConstellationCore
      - package: ConstellationKit
        product: ConstellationProcess
      - package: ConstellationKit
        product: ConstellationProviders
      - package: ConstellationKit
        product: ConstellationMCP
      - package: ConstellationKit
        product: ConstellationGit
      - package: ConstellationKit
        product: ConstellationGitHub
      - package: ConstellationKit
        product: ConstellationStore
      - package: ConstellationKit
        product: constellation-mcp
        link: false
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: Sparkle
    postBuildScripts:
      - name: Embed constellation-mcp helper
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/constellation-mcp
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/constellation-mcp
        script: |
          set -euo pipefail
          helpers="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          cp -f "$BUILT_PRODUCTS_DIR/constellation-mcp" "$helpers/constellation-mcp"
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          # A release needs a secure timestamp for notarization; a debug build skips the network trip.
          timestamp=$([ "$CONFIGURATION" = Release ] && [ "$identity" != "-" ] && echo "--timestamp" || echo "--timestamp=none")
          codesign --force --options runtime $timestamp --sign "$identity" "$helpers/constellation-mcp"
